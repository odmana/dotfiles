onboarding = false
[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[keys]
prefix = "cmd+a"
edit_scrollback = "prefix+shift+e"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "~/dotfiles/herdr/open-ttt.sh"
description = "open TTT editor"
